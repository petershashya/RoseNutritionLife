<div class="modal fade" id="stockaddproduct" tabindex="-1">
<div class="modal-dialog modal-xl">
<div class="modal-content">

    <form method="POST" id="stockAddProductForm" data-url="{% url 'stockaddproduct' %}">
            {% csrf_token %}

            <div class="modal-header">
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>


            <div class="modal-body">
            <h5 class="mb-3 bg-success text-light p-2 rounded">
            Add Debtor
            </h5>


            <table class="table table-bordered">

            <tr>
            <th style="width:30%">Member Name</th>
            <td>
            <input type="text" name="member_name" class="form-control">
            </td>
            </tr>

            <tr>
            <th>Membership No</th>
            <td>
            <input type="text" name="membership_no" class="form-control" maxlength="7">
            </td>
            </tr>

            <tr>
            <th>Member Mobile</th>
            <td>
            <input type="text" name="member_mobile" class="form-control" maxlength="10">
            </td>
            </tr>

            </table>



            <h5 class="mt-4">Select Stock Products</h5>
            <div class="table-responsive-sm" style="max-height:350px; overflow-y:auto;">
            <table class="table table-striped table-hover">
            <thead>
            <tr>
            <th>Product</th>
            <th>PV</th>
            <th>Cost</th>
            <th>Remain</th>
            <th>Qty</th>
            <th>Total</th>
            </tr>
            </thead>

            <tbody>

           {% for p in products %}
            <tr>

            <td>{{ p.product_name }}</td>

            <td class="pv text-center">{{ p.product_pv }}</td>

            <td class="cost text-center">{{ p.product_cost }}</td>

            <td class="remain text-center">{{ p.available_qty }}</td>

            <td class="text-center">

            <input type="hidden" name="product_id[]" value="{{ p.id }}">

           <input
            type="number"
            name="qty[]"
            class="form-control text-center qty-input"
            min="1"
            max="{{ p.available_qty }}">

            </td>

            <td class="total-cost text-center">0.00</td>

            </tr>

{% endfor %}

            </tbody>
            </table>

            </div>

            </div>


            <div class="modal-footer">
            <button type="submit" class="btn btn-success" id="submitStockProduct">
            Add Debtor
            </button>
            </div>

    </form>

</div>
</div>
</div>


<!-- javascript autocost codes -->
<script>

document.addEventListener("input", function(e){

if(e.target.classList.contains("qty-input")){

let row = e.target.closest("tr")

let cost = parseFloat(row.querySelector(".cost").innerText)

let qty = parseFloat(e.target.value) || 0

let total = cost * qty

row.querySelector(".total-cost").innerText = total.toFixed(2)

}

})

</script>
